# CI: corre las pruebas de tests/ en cada cambio del pipeline o de las pruebas
name: CI

on:
  push:
    paths: ["vigia-etl/**", "tests/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["vigia-etl/**", "tests/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5      # PySpark 4 necesita Java 17 o más
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instala PySpark y pytest
        run: pip install pyspark==4.0.1 pytest
      - name: Corre las pruebas
        run: pytest -v tests